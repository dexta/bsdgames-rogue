<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSD-Rogue Terminal</title>
    
    <link rel="stylesheet" href="css/xterm.css" />
    
    <style>
        :root {
            --bg-void: #05070a;
            --panel-bg: #0b0e14;
            --tech-cyan: #00f2ff;
            --text-dim: #888899;
            --border-color: #1a2230;
            --alert-red: #ff3366;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-void);
            color: var(--tech-cyan);
            font-family: "JetBrains Mono", "Fira Code", monospace;
            overflow: hidden;
        }

        /* Hauptcontainer */
        #app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* CRT Overlay - Liegt über allem und lässt Klicks durch */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            display: block;
        }

        /* CRT FX Klassen */
        .crt-active #crt-overlay {
            background: linear-gradient(
                to bottom,
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            animation: flicker 0.15s infinite;
        }

        .crt-active .xterm-text-layer {
            text-shadow: 0 0 5px rgba(0, 242, 255, 0.7);
        }

        @keyframes flicker {
            0% { opacity: 0.96; }
            50% { opacity: 1.0; }
            100% { opacity: 0.98; }
        }

        /* Start-Bildschirm / Login Overlay */
        #login-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-void);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            box-sizing: border-box;
            padding: 20px;
        }

        .system-panel {
            background: var(--panel-bg);
            border: 1px solid var(--tech-cyan);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--tech-cyan);
            padding-bottom: 10px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Spielerliste Grid */
        #player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .player-badge {
            background: #121824;
            border: 1px solid var(--border-color);
            color: var(--tech-cyan);
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-badge:hover {
            border-color: var(--tech-cyan);
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: #05070a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--tech-cyan);
        }

        button.btn-primary {
            background: var(--tech-cyan);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        button.btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        /* Controls / Gamepad Info Box */
        .controls-info {
            margin-top: 25px;
            font-size: 11px;
            color: var(--text-dim);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            line-height: 1.6;
        }

        /* Terminal Container */
        #terminal-container {
            width: 100%;
            height: 100%;
            display: none;
        }

        /* FX Toggle Button in der oberen Ecke */
        #fx-toggle {
            position: absolute;
            top: 12px;
            right: 15px;
            z-index: 150;
            background: var(--panel-bg);
            border: 1px solid var(--tech-cyan);
            color: var(--tech-cyan);
            padding: 6px 10px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body class="crt-active">

    <div id="app-wrapper">
        <div id="crt-overlay"></div>

        <button id="fx-toggle">[ CRT: ON ]</button>

        <div id="login-screen">
            <div class="system-panel">
                <h1>// ROGUE INSTANZ LAUNCHER</h1>

                <label>EXISTIERENDE PROFILE (SAVES):</label>
                <div id="player-list">
                    <span style="color: var(--text-dim); font-size:12px;">Lade Profile...</span>
                </div>

                <label>ODER NEUEN AGENTEN ANLEGEN:</label>
                <div class="input-group">
                    <input type="text" id="username-input" placeholder="Name eingeben..." maxlength="16" autocomplete="off" />
                    <button class="btn-primary" id="start-btn">START</button>
                </div>

                <div class="controls-info">
                    <strong>GAMEPAD MAPPING:</strong><br>
                    D-Pad = Steuerung (h, j, k, l)<br>
                    [A] = Bestätigen / Raumzeit<br>
                    [B] = Inventar (i) | [X] = Suchen (s) | [Y] = Speichern (S)
                </div>
            </div>
        </div>

        <div id="terminal-container"></div>
    </div>

    <script src="js/xterm.js"></script>
    <script src="js/addon-fit.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let term = null;
        let fitAddon = null;

        const loginScreen = document.getElementById('login-screen');
        const termContainer = document.getElementById('terminal-container');
        const playerListContainer = document.getElementById('player-list');
        const usernameInput = document.getElementById('username-input');

        // --- 1. PROFIL-LISTE VOM SERVER EMPFANGEN ---
        socket.emit('get-players');

        socket.on('player-list', (players) => {
            playerListContainer.innerHTML = '';
            if (!players || players.length === 0) {
                playerListContainer.innerHTML = '<span style="color:var(--text-dim); font-size:12px;">Keine alten Savegames vorhanden.</span>';
                return;
            }

            players.forEach(name => {
                const badge = document.createElement('button');
                badge.className = 'player-badge';
                badge.innerText = `> ${name}`;
                badge.onclick = () => launchGame(name);
                playerListContainer.appendChild(badge);
            });
        });

        // --- 2. SPIEL LAUNCHEN & TERMINAL NEU ERSTELLEN ---
        function launchGame(username) {
            if (!username) return;

            // UI Wechsel
            loginScreen.style.display = 'none';
            termContainer.style.display = 'block';

            // xterm-Instanz frisch aufbauen
            term = new Terminal({
                theme: {
                    background: '#05070a',
                    foreground: '#00f2ff',
                    cursor: '#00f2ff',
                    selectionBackground: 'rgba(0, 242, 255, 0.3)'
                },
                fontFamily: '"JetBrains Mono", "Fira Code", monospace',
                fontSize: 16,
                cursorBlink: true
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(termContainer);
            
            setTimeout(() => {
                fitAddon.fit();
                // Spiel-Sitzung auf Server anfordern
                socket.emit('start-game', { 
                    username: username,
                    cols: term.cols,
                    rows: term.rows
                });
            }, 50);

            // Terminal I/O Bindings
            term.onData(data => socket.emit('input', data));
        }

        // Klick auf Start-Button für neuen Namen
        document.getElementById('start-btn').onclick = () => {
            const name = usernameInput.value.trim();
            if (name) launchGame(name);
        };

        usernameInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const name = usernameInput.value.trim();
                if (name) launchGame(name);
            }
        };

        // Server Output im Terminal zeichnen
        socket.on('output', data => {
            if (term) term.write(data);
        });

        // --- 3. GAME LOOP: RÜCKKEHR ZUM MENÜ BEI BEENDIGUNG ---
        socket.on('game-ended', () => {
            // Terminal zerstören
            if (term) {
                term.dispose();
                term = null;
                fitAddon = null;
            }

            // UI zurücksetzen
            termContainer.style.display = 'none';
            loginScreen.style.display = 'flex';
            usernameInput.value = '';

            // Liste neu laden
            socket.emit('get-players');
        });

        // Fenstergrößen-Anpassung
        window.addEventListener('resize', () => {
            if (term && fitAddon) {
                fitAddon.fit();
                socket.emit('resize', { cols: term.cols, rows: term.rows });
            }
        });

        // --- 4. GAMEPAD CONTROL LOOP (DEBOUNCED) ---
        const GAMEPAD_MAPPING = {
            12: 'k', // D-Pad Hoch
            13: 'j', // D-Pad Runter
            14: 'h', // D-Pad Links
            15: 'l', // D-Pad Rechts
            0: ' ',  // A -> Leertaste
            1: 'i',  // B -> Inventar
            2: 's',  // X -> Suchen
            3: 'S',  // Y -> Speichern (Rogue Save)
        };

        let lastButtonState = {};

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];

            if (gp && term) {
                gp.buttons.forEach((button, index) => {
                    const isPressed = button.pressed;
                    const wasPressed = lastButtonState[index];

                    if (isPressed && !wasPressed) {
                        const keyToSend = GAMEPAD_MAPPING[index];
                        if (keyToSend) {
                            socket.emit('input', keyToSend);
                        }
                    }
                    lastButtonState[index] = isPressed;
                });
            }
            requestAnimationFrame(pollGamepad);
        }
        requestAnimationFrame(pollGamepad);

        // --- 5. CRT TOGGLE LOGIK ---
        const fxToggleBtn = document.getElementById('fx-toggle');
        let crtOn = true;

        fxToggleBtn.onclick = () => {
            crtOn = !crtOn;
            document.body.classList.toggle('crt-active', crtOn);
            fxToggleBtn.innerText = crtOn ? '[ CRT: ON ]' : '[ CRT: OFF ]';
        };
    </script>
</body>
</html>
