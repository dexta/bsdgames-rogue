<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSD-Rogue Terminal</title>
    
    <link rel="stylesheet" href="css/xterm.css" />
    
    <style>
        :root {
            --bg-void: #05070a; --panel-bg: #0b0e14; --tech-cyan: #00f2ff;
            --text-dim: #888899; --border-color: #1a2230;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-void); color: var(--tech-cyan);
            font-family: "JetBrains Mono", "Fira Code", monospace;
            overflow: hidden; user-select: none;
        }

        #app-wrapper { position: relative; width: 100%; height: 100%; }

        /* CRT FX */
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }
        .crt-active #crt-overlay {
            background: linear-gradient(to bottom, rgba(18,16,16,0) 50%, rgba(0,0,0,0.35) 50%);
            background-size: 100% 4px; animation: flicker 0.15s infinite;
        }
        .crt-active .xterm-text-layer { text-shadow: 0 0 5px rgba(0, 242, 255, 0.7); }
        @keyframes flicker { 0% {opacity:0.96;} 50% {opacity:1;} 100% {opacity:0.98;} }

        /* UI Panels */
        .screen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-void); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50; padding: 20px; box-sizing: border-box;
        }
        
        .system-panel {
            background: var(--panel-bg); border: 1px solid var(--tech-cyan);
            padding: 30px; width: 100%; max-width: 500px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
        }

        h1, h2 { margin-top: 0; border-bottom: 1px dashed var(--tech-cyan); padding-bottom: 10px; letter-spacing: 1px;}
        
        .btn {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            color: var(--tech-cyan); padding: 8px 12px; font-family: inherit;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .btn:hover { border-color: var(--tech-cyan); background: rgba(0,242,255,0.1); }
        .btn-primary { background: var(--tech-cyan); color: #000; border: 1px solid var(--tech-cyan); font-weight: bold; }
        .btn-primary:hover { background: #fff; box-shadow: 0 0 10px #fff; }

        input[type="text"] {
            background: #05070a; border: 1px solid var(--border-color); color: #fff;
            padding: 10px; font-family: inherit; flex: 1; outline: none;
        }

        .list-container { max-height: 200px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px;}
        .save-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); padding: 5px 10px; }

        /* Top Bar (Font & FX Controls) */
        #top-bar {
            position: absolute; top: 10px; right: 15px; z-index: 150;
            display: flex; gap: 5px;
        }

        /* Config Modal */
        #config-modal {
            display: none; position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            z-index: 200; width: 400px;
        }
        .mapping-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px;}
        .mapping-btn { width: 100px; font-size: 11px; }
        .mapping-btn.listening { background: var(--tech-cyan); color: #000; }

        #terminal-container { width: 100%; height: 100%; display: none; }
    </style>
</head>
<body class="crt-active">

    <div id="app-wrapper">
        <div id="crt-overlay"></div>

        <div id="top-bar">
            <button class="btn" id="font-minus">[ A- ]</button>
            <button class="btn" id="font-plus">[ A+ ]</button>
            <button class="btn" id="fx-toggle">[ CRT: ON ]</button>
            <button class="btn" id="config-toggle">[ IO-CFG ]</button>
        </div>

        <div id="login-screen" class="screen-overlay">
            <div class="system-panel">
                <h1>// IDENTIFIKATION</h1>
                <p style="color:var(--text-dim); font-size:12px;">Wähle Agent oder erstelle neuen:</p>
                <div id="player-list" class="list-container" style="flex-direction:row; flex-wrap:wrap;"></div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <input type="text" id="username-input" placeholder="Name..." maxlength="16" autocomplete="off" />
                    <button class="btn btn-primary" id="login-btn">LADEN</button>
                </div>
            </div>
        </div>

        <div id="save-screen" class="screen-overlay" style="display:none;">
            <div class="system-panel">
                <h2>// SAVE MANAGER: <span id="current-user-display"></span></h2>
                <div id="save-list" class="list-container"></div>
                <div style="display:flex; justify-content:space-between; margin-top:15px;">
                    <button class="btn" id="back-to-login">< ZURÜCK</button>
                    <button class="btn btn-primary" id="new-run-btn">NEUER RUN (CLEAN)</button>
                </div>
            </div>
        </div>

        <div id="config-modal" class="system-panel">
            <h2>// GAMEPAD MAPPING</h2>
            <div id="mapping-list"></div>
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn" id="reset-mapping">RESET</button>
                <button class="btn btn-primary" id="close-config">SCHLIESSEN</button>
            </div>
        </div>

        <div id="terminal-container"></div>
    </div>

    <script src="js/xterm.js"></script>
    <script src="js/addon-fit.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let term = null;
        let fitAddon = null;
        let activeUser = null;
        let terminalFontSize = 16;
        let isConfigOpen = false;

        // UI Elemente
        const screens = {
            login: document.getElementById('login-screen'),
            saves: document.getElementById('save-screen'),
            term: document.getElementById('terminal-container')
        };
        const showScreen = (name) => {
            Object.values(screens).forEach(s => s.style.display = 'none');
            screens[name].style.display = 'flex';
            if(name === 'term') screens[name].style.display = 'block';
        };

        // --- 1. PROFIL AUSWAHL ---
        socket.emit('get-players');
        socket.on('player-list', (players) => {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(name => {
                const b = document.createElement('button');
                b.className = 'btn'; b.innerText = name;
                b.onclick = () => selectUser(name);
                list.appendChild(b);
            });
        });

        document.getElementById('login-btn').onclick = () => {
            const name = document.getElementById('username-input').value.trim();
            if (name) selectUser(name);
        };

        function selectUser(name) {
            activeUser = name;
            document.getElementById('current-user-display').innerText = name;
            showScreen('saves');
            socket.emit('get-saves', activeUser);
        }

        // --- 2. SAVE SCUMMING MANAGER ---
        socket.on('save-list', ({ username, saves }) => {
            if (username !== activeUser) return;
            const list = document.getElementById('save-list');
            list.innerHTML = saves.length === 0 ? '<div class="save-item" style="color:var(--text-dim)">Keine Saves gefunden.</div>' : '';
            
            saves.forEach(saveName => {
                const div = document.createElement('div');
                div.className = 'save-item';
                div.innerHTML = `<span>${saveName}</span> 
                    <div>
                        <button class="btn" style="padding:2px 6px; font-size:11px; margin-right:5px;" onclick="cloneSave('${saveName}')">CLONE</button>
                        <button class="btn btn-primary" style="padding:2px 6px; font-size:11px;" onclick="bootGame('${saveName}')">BOOT</button>
                    </div>`;
                list.appendChild(div);
            });
        });

        window.cloneSave = (filename) => socket.emit('clone-save', { username: activeUser, filename });
        
        document.getElementById('back-to-login').onclick = () => { activeUser = null; showScreen('login'); };
        document.getElementById('new-run-btn').onclick = () => bootGame('rogue.save'); // Überschreibt/Startet neu wenn Ingame ignoriert

        // --- 3. GAME BOOT & TERMINAL ---
        function bootGame(saveFile) {
            showScreen('term');
            
            term = new Terminal({
                theme: { background: '#05070a', foreground: '#00f2ff', cursor: '#00f2ff' },
                fontFamily: '"JetBrains Mono", monospace', fontSize: terminalFontSize, cursorBlink: true
            });
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(screens.term);
            
            setTimeout(() => {
                fitAddon.fit();
                socket.emit('start-game', { username: activeUser, saveFile: saveFile, cols: term.cols, rows: term.rows });
            }, 50);

            term.onData(data => { if(!isConfigOpen) socket.emit('input', data); });
        }

        socket.on('output', data => { if (term) term.write(data); });
        socket.on('game-ended', () => {
            if (term) { term.dispose(); term = null; }
            showScreen('saves');
            socket.emit('get-saves', activeUser); // Refresh saves
        });

        window.addEventListener('resize', () => {
            if (term && fitAddon && screens.term.style.display === 'block') {
                fitAddon.fit();
                socket.emit('resize', { cols: term.cols, rows: term.rows });
            }
        });

        // --- 4. TOP BAR CONTROLS (Font & FX) ---
        document.getElementById('font-plus').onclick = () => {
            if(!term) return;
            terminalFontSize = Math.min(terminalFontSize + 2, 32);
            term.options.fontSize = terminalFontSize;
            fitAddon.fit(); socket.emit('resize', { cols: term.cols, rows: term.rows });
        };
        document.getElementById('font-minus').onclick = () => {
            if(!term) return;
            terminalFontSize = Math.max(terminalFontSize - 2, 10);
            term.options.fontSize = terminalFontSize;
            fitAddon.fit(); socket.emit('resize', { cols: term.cols, rows: term.rows });
        };

        let crtOn = true;
        const fxBtn = document.getElementById('fx-toggle');
        fxBtn.onclick = () => {
            crtOn = !crtOn;
            document.body.classList.toggle('crt-active', crtOn);
            fxBtn.innerText = crtOn ? '[ CRT: ON ]' : '[ CRT: OFF ]';
        };

        // --- 5. GAMEPAD CONFIG & REMAPPING ---
        const DEFAULT_MAP = {
            'D-Pad UP': { btn: 12, key: 'k' }, 'D-Pad DOWN': { btn: 13, key: 'j' },
            'D-Pad LEFT': { btn: 14, key: 'h' }, 'D-Pad RIGHT': { btn: 15, key: 'l' },
            'Action / Enter': { btn: 0, key: ' ' }, 'Inventory': { btn: 1, key: 'i' },
            'Search': { btn: 2, key: 's' }, 'Save Game': { btn: 3, key: 'S' }
        };

        // Lade aus LocalStorage oder nutze Default
        let currentMap = JSON.parse(localStorage.getItem('rogue_mapping')) || JSON.parse(JSON.stringify(DEFAULT_MAP));
        let listeningForAction = null;
        let lastButtonState = {};

        function renderConfigMenu() {
            const list = document.getElementById('mapping-list');
            list.innerHTML = '';
            for (const [action, data] of Object.entries(currentMap)) {
                const row = document.createElement('div'); row.className = 'mapping-row';
                row.innerHTML = `<span>${action} (Key: <b>${data.key}</b>)</span> 
                                 <button class="btn mapping-btn" id="map-btn-${action.replace(/\s/g, '')}">B${data.btn}</button>`;
                list.appendChild(row);

                row.querySelector('button').onclick = (e) => {
                    // Reset all other listening states
                    document.querySelectorAll('.mapping-btn').forEach(b => b.classList.remove('listening'));
                    e.target.classList.add('listening');
                    e.target.innerText = "PRESS BTN...";
                    listeningForAction = action;
                };
            }
        }

        document.getElementById('config-toggle').onclick = () => {
            isConfigOpen = !isConfigOpen;
            document.getElementById('config-modal').style.display = isConfigOpen ? 'block' : 'none';
            if(isConfigOpen) renderConfigMenu();
        };
        document.getElementById('close-config').onclick = () => {
            isConfigOpen = false;
            listeningForAction = null;
            document.getElementById('config-modal').style.display = 'none';
        };
        document.getElementById('reset-mapping').onclick = () => {
            currentMap = JSON.parse(JSON.stringify(DEFAULT_MAP));
            localStorage.setItem('rogue_mapping', JSON.stringify(currentMap));
            renderConfigMenu();
        };

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];

            if (gp) {
                gp.buttons.forEach((button, index) => {
                    const isPressed = button.pressed;
                    const wasPressed = lastButtonState[index];

                    if (isPressed && !wasPressed) {
                        // Befinden wir uns im Zuweisungs-Modus?
                        if (listeningForAction) {
                            currentMap[listeningForAction].btn = index;
                            localStorage.setItem('rogue_mapping', JSON.stringify(currentMap));
                            listeningForAction = null;
                            renderConfigMenu();
                        } 
                        // Senden ans Terminal (nur wenn Config geschlossen ist und Terminal aktiv)
                        else if (!isConfigOpen && term) {
                            // Finde heraus, ob der gedrückte Index gemappt ist
                            for (const action in currentMap) {
                                if (currentMap[action].btn === index) {
                                    socket.emit('input', currentMap[action].key);
                                    break; // Ein Button feuert nur eine Aktion
                                }
                            }
                        }
                    }
                    lastButtonState[index] = isPressed;
                });
            }
            requestAnimationFrame(pollGamepad);
        }
        requestAnimationFrame(pollGamepad);
    </script>
</body>
</html>
