<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSD-Rogue Maschinen-Instanz</title>
    
    <link rel="stylesheet" href="css/xterm.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="crt-active">

    <div id="main-layout">
        
        <div id="terminal-wrapper">
            <div id="crt-overlay"></div>
            
            <div id="login-screen" class="screen-overlay">
                <div class="system-panel">
                    <h1>// IDENTIFIKATION</h1>
                    <div id="player-list" class="list-container" style="flex-direction:row; flex-wrap:wrap;"></div>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="text" id="username-input" placeholder="Agenten-Name..." maxlength="16" autocomplete="off" />
                        <button class="btn btn-primary" id="login-btn">LADEN</button>
                    </div>
                </div>
            </div>

            <div id="save-screen" class="screen-overlay" style="display:none;">
                <div class="system-panel">
                    <h2>// SAVE MANAGER: <span id="current-user-display"></span></h2>
                    <div id="save-list" class="list-container"></div>
                    <div style="display:flex; justify-content:space-between; margin-top:15px;">
                        <button class="btn" id="back-to-login">< ZURÜCK</button>
                        <button class="btn btn-primary" id="new-run-btn">NEUER RUN</button>
                    </div>
                </div>
            </div>

            <div id="terminal-container"></div>
        </div>

        <div id="sidebar">
            
            <div id="system-controls">
                <div class="control-row">
                    <button class="btn" id="font-minus" title="Schrift verkleinern">[ A- ]</button>
                    <button class="btn" id="font-plus" title="Schrift vergrößern">[ A+ ]</button>
                    <button class="btn" id="fx-toggle" style="flex: 1;">[ CRT: ON ]</button>
                </div>
                <div class="control-row" style="margin-top: 5px;">
                    <button class="btn" id="hud-detail-toggle" style="flex: 1;">[ HUD: BEIDE ]</button>
                    <button class="btn" id="config-toggle" style="flex: 1;">[ CONFIG ]</button>
                </div>
            </div>

            <div id="inventory-section">
                <div class="sidebar-header">// INVENTORY (LAST KNOWN)</div>
                <div id="inventory-list">Warte auf Scan... (Drücke 'i' im Spiel)</div>
            </div>
            
            <div id="controls-section">
                <div class="sidebar-header" id="controls-header">// IO-MAPPING: DEFAULT</div>
                
                <div id="visual-gamepad">
                    <div class="gp-btn gp-l2" id="btn-vis-L2">L2 <span class="act-label">SHIFT</span></div>
                    <div class="gp-btn gp-r2" id="btn-vis-R2">R2 <span class="act-label">CTRL</span></div>

                    <div class="gp-btn gp-l1" id="btn-vis-L1">L1<span class="act-label"></span></div>
                    <div class="gp-btn gp-r1" id="btn-vis-R1">R1<span class="act-label"></span></div>
                    
                    <div class="gp-dpad">
                        <div class="gp-btn gp-up" id="btn-vis-UP"><span class="act-label"></span></div>
                        <div class="gp-btn gp-left" id="btn-vis-LEFT"><span class="act-label"></span></div>
                        <div class="gp-btn gp-right" id="btn-vis-RIGHT"><span class="act-label"></span></div>
                        <div class="gp-btn gp-down" id="btn-vis-DOWN"><span class="act-label"></span></div>
                    </div>

                    <div class="gp-action">
                        <div class="gp-btn gp-y" id="btn-vis-Y">Y<span class="act-label"></span></div>
                        <div class="gp-btn gp-x" id="btn-vis-X">X<span class="act-label"></span></div>
                        <div class="gp-btn gp-b" id="btn-vis-B">B<span class="act-label"></span></div>
                        <div class="gp-btn gp-a" id="btn-vis-A">A<span class="act-label"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="config-modal" class="system-panel" style="display:none; position:absolute; top:5%; left:50%; transform:translateX(-50%); z-index: 300; width: 450px;">
        <h2>// GAMEPAD REMAPPING</h2>
        <select id="layer-select" class="btn" style="width:100%; margin-bottom:15px; font-weight: bold; text-align: center;">
            <option value="DEFAULT">--- LAYER: DEFAULT (Navigation) ---</option>
            <option value="L1">--- LAYER: L1 (Combat / Diag) ---</option>
            <option value="R1">--- LAYER: R1 (Items / Action) ---</option>
        </select>
        
        <div id="mapping-list" style="max-height: 400px; overflow-y: auto; padding-right: 10px; margin-bottom: 15px;"></div>
        
        <div style="display: flex; justify-content: space-between;">
            <button class="btn" id="reset-mapping" style="color: var(--alert); border-color: var(--alert);">RESET DEFAULTS</button>
            <button class="btn btn-primary" id="close-config">SCHLIESSEN</button>
        </div>
    </div>

    <script src="js/xterm.js"></script>
    <script src="js/gamepad_standardizer.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script src="js/app.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/gamepad.js"></script>

</body>
</html>
